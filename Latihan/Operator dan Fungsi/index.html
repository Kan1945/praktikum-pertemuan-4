<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luas Persegi Panjang</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f1f5f9);
      color: #1e293b;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(30, 41, 59, 0.12);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 22px;
      text-align: center;
      color: #4f46e5;
    }

    #hasil p {
      margin: 0 0 12px;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.5;
      background: #eef2ff;
      border-left: 4px solid #4f46e5;
      border-radius: 8px;
    }

    #hasil p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hitung Luas Persegi Panjang</h1>
    <div id="hasil"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
