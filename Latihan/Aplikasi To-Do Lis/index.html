<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 16px;
    }

    #output5 {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin: 0 0 16px;
      text-align: center;
      color: #333;
    }

    #task-input {
      width: calc(100% - 90px);
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #task-input:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }

    #add-task {
      width: 80px;
      padding: 10px;
      margin-left: 6px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #add-task:hover { background: #357abd; }
    #add-task:active { transform: scale(0.97); }

    #task-list {
      list-style: none;
      padding: 0;
      margin: 16px 0 0;
    }

    #task-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #eee;
      transition: background 0.2s;
    }

    #task-list li:hover { background: #f7f9fc; }

    #task-list input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    #task-list span {
      flex: 1;
      color: #333;
      word-break: break-word;
    }

    #task-list li button {
      padding: 6px 10px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #task-list li button:hover { background: #c0392b; }
  </style>
</head>
<body>

  <div id="output5">
    <h2>To-Do List</h2>
  </div>

  <script src="script.js"></script>

</body>
</html>
